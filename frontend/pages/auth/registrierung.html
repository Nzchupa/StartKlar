<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrierung – StartKlar</title>

    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="site-logo" href="../../index.html">StartKlar</a>
        </div>
    </header>

    <main class="site-main">
        <div class="container">
            <h1>Konto erstellen</h1>
            <p>Registrieren Sie sich, um Ihren Businessplan zu erstellen.</p>

            <form>
                <p>
                    <label for="name">Vor- und Nachname</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">E-Mail-Adresse</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="password">Passwort</label><br>
                    <input type="password" id="password" name="password" required>
                </p>

                <button type="submit">Registrieren</button>
            </form>

            <p>Schon ein Konto?
                <a href="login.html">Zum Login</a>
            </p>

            <p><a href="../../index.html">Zurück zur Startseite</a></p>
        </div>
    </main>
</body>
</html>
