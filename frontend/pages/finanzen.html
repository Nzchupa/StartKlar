<!DOCTYPE html>
<!--
  VORLAGE für neue Seiten. Diese Datei wird nicht verlinkt.

  So legst du eine neue Seite an:
  1. Datei kopieren und umbenennen, z. B. pages/plan-anlegen.html
  2. <title> und den Inhalt in <main> anpassen
  3. Falls die Seite eigenes JavaScript braucht: js/pages/plan-anlegen.js anlegen
     und unten die auskommentierte Zeile aktivieren
  Header, Footer und CSS-Dateien bleiben gleich, damit alle Seiten einheitlich aussehen.
-->
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzen – StartKlar</title>
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="site-logo" href="/">StartKlar</a>
        </div>
    </header>

    <main class="site-main">
        <div class="container">
            <h1>Finanzen</h1>
           <p>Planen Sie hier Ihre Kosten, Umsätze und den Kapitalbedarf.</p>

        <form action="/pages/businessplan.html" method="get">
          <section>
            <h2>Kosten &amp; Investitionen</h2>
            <div>
              <label for="gruendungskosten">Gründungskosten (€):</label><br>
              <input type="number" id="gruendungskosten" name="gruendungskosten" placeholder="z. B. 5000">
            </div>
            <br>
            <div>
              <label for="fixkosten">Monatliche Fixkosten (€):</label><br>
              <input type="number" id="fixkosten" name="fixkosten" placeholder="z. B. 1200">
            </div>
          </section>

          <br>

          <section>
            <h2>Umsatzplanung</h2>
            <div>
              <label for="umsatz_monat">Erwarteter Monatsumsatz (€):</label><br>
              <input type="number" id="umsatz_monat" name="umsatz_monat" placeholder="z. B. 3500">
            </div>
          </section>

          <br>

          <button type="submit">Speichern &amp; Weiter</button>
        </form> 
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <span>Gruppe 5 · Hochschule Mittweida · WS 2026/27</span>
            <span id="backend-status" class="backend-status">Backend wird geprüft …</span>
        </div>
    </footer>

    <script src="/js/api.js" defer></script>
    <script src="/js/main.js" defer></script>
    <!-- <script src="/js/pages/seitenname.js" defer></script> -->
</body>
</html>
