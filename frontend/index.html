<!DOCTYPE html>
<!--
  Startseite von StartKlar.
  Aufbau jeder Seite: Header (Kopfzeile) -> Main (Inhalt) -> Footer (Fußzeile).
  Neue Seiten werden aus pages/vorlage.html kopiert, nicht aus dieser Datei.
-->
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StartKlar – Businessplantool</title>
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">

    <!-- Reihenfolge der CSS-Dateien nicht ändern: Variablen zuerst -->
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="site-logo" href="/">StartKlar</a>
        </div>
    </header>

    <main class="site-main">
        <div class="container">
            <h1>StartKlar</h1>
            <p class="lead">
                Hier entsteht die Webanwendung StartKlar mit Design und Inhalten.
                Bisher gibt es nur das technische Grundgerüst, gebaut wird gerade.
            </p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <span>Gruppe 5 · Hochschule Mittweida · WS 2026/27</span>
            <!-- Wird von js/main.js ausgefüllt -->
            <span id="backend-status" class="backend-status">Backend wird geprüft …</span>
        </div>
    </footer>

    <!-- Reihenfolge der Skripte nicht ändern: api.js wird von main.js benutzt -->
    <script src="/js/api.js" defer></script>
    <script src="/js/main.js" defer></script>
</body>
</html>
