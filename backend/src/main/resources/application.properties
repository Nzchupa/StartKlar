# ------------------------------------------------------------------
# Einstellungen des StartKlar-Backends
# Alle verfügbaren Werte: https://docs.spring.io/spring-boot/appendix/application-properties/
# ------------------------------------------------------------------

spring.application.name=startklar

# Port des Webservers -> http://localhost:8080
server.port=8080

# Das Frontend liegt im Ordner "frontend" neben "backend" und wird direkt von dort ausgeliefert.
# Zwei Pfade, damit es egal ist, ob aus "backend" oder aus dem Projekt-Hauptordner gestartet wird.
spring.web.resources.static-locations=file:../frontend/,file:frontend/

# Kein Caching während der Entwicklung: Änderungen an HTML/CSS/JS sind nach F5 sofort sichtbar
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# LiveReload von DevTools wird nicht genutzt
spring.devtools.livereload.enabled=false

# Nur lokale MVP-Nutzung, bis Anmeldung und Zugriffsschutz implementiert sind.
server.address=127.0.0.1

# Persistente H2-Datenbank; unabhängig vom aktuellen Arbeitsordner.
# Bei Bedarf kann STARTKLAR_DB_PATH auf einen anderen lokalen Dateipfad gesetzt werden.
spring.datasource.url=jdbc:h2:file:${STARTKLAR_DB_PATH:${user.home}/.startklar/startklar}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Keine technischen Fehlerdetails an den Browser ausgeben.
server.error.include-stacktrace=never
server.error.include-message=never
